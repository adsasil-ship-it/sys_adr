<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Atendimento - TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0a0b0e; color: #fff; padding: 30px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f2128; padding-bottom: 20px; margin-bottom: 30px; }
    .logo { font-size: 2.2rem; font-weight: bold; color: #00b37e; }
    .clock { font-size: 2.5rem; font-family: monospace; font-weight: bold; color: #61dafb; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex: 1; }
    .box { background: #14151a; border: 1px solid #282930; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; }
    .box-title { font-size: 1.4rem; color: #8d8d99; text-transform: uppercase; margin-bottom: 20px; font-weight: bold; }

    /* Destaque Atendimento */
    .featured-card { background: #1a2f26; border: 3px solid #00b37e; border-radius: 12px; padding: 40px; text-align: center; margin-auto: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .featured-card h1 { font-size: 4rem; color: #fff; margin-bottom: 10px; }
    .featured-card p { font-size: 2rem; color: #00b37e; font-weight: bold; }
    
    /* Fila de Espera */
    .queue-list { list-style: none; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    .queue-item { background: #1f2128; border-radius: 10px; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; font-size: 1.8rem; }
    .queue-item .pos { background: #00b37e; color: #121214; font-weight: bold; padding: 5px 15px; border-radius: 8px; font-size: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🖨️ ACOMPANHAMENTO DE ATENDIMENTO</div>
    <div class="clock" id="tv-clock">00:00:00</div>
  </header>

  <div class="grid">
    <!-- CLIENTE EM ATENDIMENTO -->
    <div class="box">
      <div class="box-title">🔔 Em Atendimento Agora</div>
      <div class="featured-card">
        <h1 id="tv-active-name">Aguardando...</h1>
        <p id="tv-active-type">---</p>
      </div>
    </div>

    <!-- FILA DE ESPERA -->
    <div class="box">
      <div class="box-title">👥 Próximos da Fila</div>
      <ul class="queue-list" id="tv-queue"></ul>
    </div>
  </div>

  <script>
    function updateClock() {
      document.getElementById('tv-clock').innerText = new Date().toLocaleTimeString('pt-BR');
    }
    setInterval(updateClock, 1000); updateClock();

    function updateTVData() {
      const customers = JSON.parse(localStorage.getItem('g_customers')) || [];
      const active = customers.find(c => c.status === 'EM_ANDAMENTO');

      if (active) {
        document.getElementById('tv-active-name').innerText = active.name;
        document.getElementById('tv-active-type').innerText = active.type;
      } else {
        document.getElementById('tv-active-name').innerText = "Livre";
        document.getElementById('tv-active-type').innerText = "Próximo cliente pode se aproximar";
      }

      const queue = customers.filter(c => c.status === 'AGENDADO');
      const queueList = document.getElementById('tv-queue');
      
      if (queue.length === 0) {
        queueList.innerHTML = `<li class="queue-item" style="color:#8d8d99;">Ninguém na fila de espera.</li>`;
      } else {
        queueList.innerHTML = queue.map((c, idx) => `
          <li class="queue-item">
            <span>${c.name} <small style="font-size:1.2rem; color:#8d8d99;">(${c.type})</small></span>
            <span class="pos">#${idx + 1}</span>
          </li>
        `).join('');
      }
    }

    // Sincronização em tempo real via Broadcast Channel e Storage Events
    const bc = new BroadcastChannel('tv_channel');
    bc.onmessage = () => updateTVData();
    window.addEventListener('storage', () => updateTVData());
    updateTVData();
  </script>
</body>
</html>

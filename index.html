<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adriano Design — Protótipo V4</title>
<style>
:root{--cream:#FFF9EB;--blue:#6386AC;--navy:#112E4A;--black:#000;--white:#fff;--line:#d9e1e8;--muted:#657586;--ok:#2e8b57;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f7f9;color:var(--navy)}
button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:235px;background:var(--navy);color:#fff;padding:20px 12px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-weight:900;font-size:20px;padding:8px 10px 22px}.brand small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:4px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#dfe9f2;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--blue);color:#fff}.main{margin-left:235px;width:calc(100% - 235px)}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.search{border:1px solid var(--line);background:#f5f8fb;border-radius:8px;padding:9px 12px;width:300px}.clock{font-weight:900;font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}.content{padding:25px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:18px}.head h1{margin:0}.head p{margin:5px 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 5px 18px #112e4a0b}.label{font-size:12px;color:var(--muted);text-transform:uppercase}.metric{font-size:27px;font-weight:900;margin:6px 0}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;margin-top:15px}.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf0f5;font-size:11px}.badge.ok{background:#dff4e8;color:#17653c}.badge.wait{background:#fff0d6;color:#8a5a00}.timer{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--navy)}.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg{display:grid;gap:5px}.fg label{font-size:12px;color:var(--muted)}.full{grid-column:1/-1}.public{min-height:calc(100vh - 120px);background:var(--cream);border:1px solid #eadfca;border-radius:18px;padding:28px}.publicbox{max-width:760px;margin:auto;background:#fff;border-radius:16px;padding:25px;border:1px solid var(--line);box-shadow:0 15px 40px #112e4a14}.publicbrand{text-align:center;margin-bottom:20px}.publicbrand h2{margin:5px 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice .btn{padding:18px}.notice{background:var(--cream);border:1px solid #eadfca;padding:14px;border-radius:10px}.tv{background:var(--navy);color:#fff;min-height:calc(100vh - 120px);border-radius:18px;padding:28px}.tvgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:25px}.tvcard{border:1px solid #6386ac;background:#0b243b;border-radius:16px;padding:24px}.tv .ticket{font-size:72px;font-weight:900}.tv .tvtime{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}.note{white-space:pre-wrap;background:var(--cream);border:1px solid #eadfca;border-radius:10px;padding:16px;color:var(--navy)}.progress{height:8px;background:#e8edf2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.column{background:#eef3f7;border-radius:12px;padding:12px}.job{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;margin:8px 0}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:18px}.modalbox{width:min(650px,100%);background:#fff;border-radius:14px;padding:22px}.hidden{display:none}.footerlink{margin-top:16px;font-size:12px;color:var(--muted)}
@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%}.cards{grid-template-columns:1fr 1fr}.grid2,.tvgrid,.kanban{grid-template-columns:1fr}.content{padding:15px}.search{width:160px}.form,.choice{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand" style="text-align:center">
<img src="LOGO.svg" alt="Adriano Design" style="width:150px;max-height:85px;object-fit:contain;display:block;margin:0 auto 10px">
<small>Atendimento • Arte Final • Impressão</small>
</div>
<nav class="nav" id="nav">
<button data-p="dashboard" class="active">⌂ Dashboard</button>
<button data-p="entrada">🔗 Link de Atendimento</button>
<button data-p="atendimento">◷ Atendimento</button>
<button data-p="tv">▣ Tela TV / Cliente</button>
<button data-p="clientes">👥 Clientes</button>
<button data-p="ordens">▤ Ordens de Serviço</button>
<button data-p="artes">✦ Artes</button>
<button data-p="impressao">▣ Impressão</button>
<button data-p="producao">⚙ Produção</button>
<button data-p="financeiro">R$ Financeiro</button>
<button data-p="estoque">□ Estoque</button>
<button data-p="fornecedores">⌂ Fornecedores</button>
<button data-p="relatorios">▥ Relatórios</button>
<button data-p="usuarios">♟ Usuários</button>
<button data-p="config">⚙ Configurações</button>
</nav></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:14px">
<img src="LOGO.svg" alt="Adriano Design" style="width:90px;max-height:45px;object-fit:contain">
<input class="search" placeholder="Buscar cliente, OS, serviço..."></div><div style="display:flex;gap:16px;align-items:center"><span>Adriano Silva</span><span class="clock globalClock">00:00:00</span></div></header><section class="content" id="content"></section></main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const state={
 clients:[{name:"João Silva",phone:"(85) 99999-9999"},{name:"Carlos Santos",phone:"(85) 98888-8888"}],
 queue:[
  {ticket:"#025",name:"João Silva",service:"Arte Final",status:"service",delivery:true,address:"Rua Exemplo, 120 - Centro",started:Date.now()-754000},
  {ticket:"#026",name:"Carlos Santos",service:"Impressão",status:"waiting",delivery:false},
  {ticket:"#027",name:"Marcos Lima",service:"Vetorização",status:"waiting",delivery:false}
 ],
 rate:30, publicStep:"start", publicClient:null
};
const C=document.getElementById("content");
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const elapsed=q=>q&&q.started?Math.max(0,Math.floor((Date.now()-q.started)/1000)):0;
const ft=s=>[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,"0")).join(":");
const head=(t,s,b="")=>`<div class="head"><div><h1>${t}</h1><p>${s}</p></div>${b}</div>`;
function dashboard(){return head("Dashboard","Visão geral da sua gráfica")+
`<div class="cards"><div class="card"><div class="label">Aguardando</div><div class="metric">${state.queue.filter(x=>x.status==="waiting").length}</div></div><div class="card"><div class="label">Em atendimento</div><div class="metric">01</div></div><div class="card"><div class="label">Produção</div><div class="metric">12</div></div><div class="card"><div class="label">A receber</div><div class="metric">R$ 2.450</div></div></div>
<div class="grid2"><div class="panel"><h3>Fila de atendimento</h3>${queueTable()}<br><button class="btn primary" onclick="go('atendimento')">Abrir atendimento</button></div><div class="panel"><h3>Produção</h3><p>OS #1025 — Impressão</p><div class="progress"><i style="width:80%"></i></div><p>OS #1026 — Fotolito</p><div class="progress"><i style="width:50%"></i></div><p>OS #1027 — Arte Final</p><div class="progress"><i style="width:30%"></i></div></div></div>`}
function queueTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Senha</th><th>Cliente</th><th>Serviço</th><th>Status</th></tr></thead><tbody>${state.queue.map(q=>`<tr><td><b>${q.ticket}</b></td><td>${q.name}</td><td>${q.service}</td><td><span class="badge ${q.status==="service"?"ok":"wait"}">${q.status==="service"?"Em atendimento":"Aguardando"}</span></td></tr>`).join("")}</tbody></table></div>`}
function atendimento(){
 const q=state.queue.find(x=>x.status==="service");
 return head("Atendimento","Cronômetro visível; o valor financeiro só aparece ao finalizar.")+
 `<div class="cards"><div class="card"><div class="label">Aguardando</div><div class="metric">${state.queue.filter(x=>x.status==="waiting").length}</div></div><div class="card"><div class="label">Em atendimento</div><div class="metric">01</div></div><div class="card"><div class="label">Orçamentos</div><div class="metric">03</div></div><div class="card"><div class="label">Finalizados hoje</div><div class="metric">18</div></div></div>
 <div class="grid2"><div class="panel"><h3>Fila</h3>${queueTable()}</div>
 <div class="panel"><div class="label">CLIENTE EM ATENDIMENTO</div><h2>${q.name}</h2><p>${q.ticket} • ${q.service}</p><div class="label">TEMPO DE ATENDIMENTO</div><div class="timer liveTimer">${ft(elapsed(q))}</div>
 <div class="notice" style="margin:12px 0"><b>Valor oculto durante o atendimento.</b><br>O cálculo de R$ ${state.rate.toFixed(2).replace(".",",")}/hora será mostrado somente ao finalizar.</div>
 <button class="btn primary" onclick="finishService()">✓ Finalizar atendimento e abrir pedido</button></div></div>`}
function finishService(){go("venda")}
function venda(){
 const q=state.queue.find(x=>x.status==="service"), secs=elapsed(q), service=secs/3600*state.rate;
 return head("Finalizar Atendimento e Venda","Agora o valor do tempo é apresentado para compor o pedido.")+
 `<div class="grid2"><div class="panel"><div class="label">Cliente</div><h2>${q.name}</h2><p>${q.ticket}</p><div class="label">Tempo de atendimento</div><div class="timer">${ft(secs)}</div><p><b>Valor do atendimento:</b> ${money(service)} <small>(R$ 30,00/h)</small></p>
 ${q.delivery?`<div class="notice"><b>Entrega solicitada</b><br>${q.address}<br><b>Frete:</b> calcular na finalização do pedido.</div>`:`<div class="notice">Retirada no local / sem frete.</div>`}</div>
 <div class="panel"><h3>Pedido</h3><table class="table"><tr><th>Item</th><th>Valor</th></tr><tr><td>Atendimento (${ft(secs)})</td><td>${money(service)}</td></tr><tr><td>Impressão</td><td>R$ 40,00</td></tr>${q.delivery?`<tr><td>Frete</td><td><input id="frete" class="field" style="width:130px" value="0,00" oninput="updateTotal()"></td></tr>`:""}</table><p style="font-size:24px;font-weight:900;text-align:right">Total: <span id="saleTotal">${money(service+40)}</span></p><button class="btn primary" onclick="finalNote()">Finalizar pedido</button></div></div>`}
function updateTotal(){const q=state.queue.find(x=>x.status==="service"),base=elapsed(q)/3600*state.rate+40,fr=parseFloat((document.getElementById("frete")?.value||"0").replace(",","."))||0;document.getElementById("saleTotal").textContent=money(base+fr)}
function finalNote(){
 const q=state.queue.find(x=>x.status==="service"),s=elapsed(q),sv=s/3600*state.rate,fr=parseFloat((document.getElementById("frete")?.value||"0").replace(",","."))||0,total=sv+40+fr;
 C.innerHTML=head("Pedido Finalizado","Nota pronta para copiar e enviar ao cliente pelo WhatsApp.")+`<div class="panel"><div class="note" id="note">ADRIANO DESIGN
RESUMO DO PEDIDO

Cliente: ${q.name}
Senha: ${q.ticket}
Tempo de atendimento: ${ft(s)}
Atendimento: ${money(sv)}
Impressão: R$ 40,00
${q.delivery?`Entrega: ${q.address}\nFrete: ${money(fr)}`:"Retirada no local"}

TOTAL: ${money(total)}

Obrigado pela preferência!</div><br><button class="btn primary" onclick="copyNote()">Copiar para WhatsApp</button></div>`}
function copyNote(){navigator.clipboard?.writeText(document.getElementById("note").innerText);alert("Nota copiada para a área de transferência.")}
function entrada(){
 return head("Link de Atendimento","Página que você poderá enviar ao cliente pelo WhatsApp.")+
 `<div class="public"><div class="publicbox"><div class="publicbrand">
<img src="LOGO.svg" alt="Adriano Design" style="width:190px;max-height:105px;object-fit:contain;margin:0 auto 12px;display:block">
<div class="label">ADRIANO DESIGNER</div><h2>Atendimento Personalizado</h2><p>Atendimento presencial ou online. Na sua vez, não importa onde estiver, você será atendido.</p></div>
 ${publicFlow()}</div></div>`}
function publicFlow(){
 if(state.publicStep==="start")return `<div class="notice">Se você já é cliente, reserve seu atendimento. Se ainda não é cliente, faça um cadastro rápido.</div><br><div class="choice"><button class="btn primary" onclick="state.publicStep='existing';go('entrada')">Já sou cliente</button><button class="btn dark" onclick="state.publicStep='new';go('entrada')">Sou novo cliente</button></div>`;
 if(state.publicStep==="existing")return `<h3>Reserve seu atendimento</h3><div class="fg"><label>Digite seu nome</label><input id="pubName" class="field" placeholder="Seu nome"></div><br><button class="btn primary" onclick="pubDelivery()">Entrar na fila</button><button class="btn" onclick="state.publicStep='start';go('entrada')">Voltar</button>`;
 if(state.publicStep==="new")return `<h3>Cadastro rápido</h3><div class="form"><div class="fg"><label>Nome</label><input id="newName" class="field"></div><div class="fg"><label>Sobrenome</label><input id="newLast" class="field"></div><div class="fg full"><label>WhatsApp</label><input id="newPhone" class="field" placeholder="(85) 99999-9999"></div></div><br><button class="btn primary" onclick="savePublicClient()">Cadastrar e continuar</button>`;
 if(state.publicStep==="delivery")return `<h3>Deseja frete para entrega de produtos?</h3><p>O valor do frete será calculado somente na hora de finalizar o pedido.</p><div class="choice"><button class="btn primary" onclick="state.publicStep='address';go('entrada')">Sim, quero entrega</button><button class="btn" onclick="joinQueue(false)">Não, vou retirar</button></div>`;
 if(state.publicStep==="address")return `<h3>Endereço de entrega</h3><div class="form"><div class="fg full"><label>Rua / Avenida</label><input id="street" class="field"></div><div class="fg"><label>Número</label><input id="number" class="field"></div><div class="fg"><label>Bairro</label><input id="district" class="field"></div><div class="fg full"><label>Complemento / referência</label><input id="comp" class="field"></div></div><br><button class="btn primary" onclick="joinQueue(true)">Salvar endereço e entrar na fila</button>`;
 if(state.publicStep==="joined"){const ahead=Math.max(0,state.queue.length-1);return `<div style="text-align:center"><span class="badge ok">ENTRADA CONFIRMADA</span><h2>Você entrou na fila</h2><div class="timer">${state.publicClient.ticket}</div><div class="notice" style="margin:15px 0"><b>Existem ${ahead} cliente(s) na sua frente.</b></div><button class="btn primary" onclick="go('acompanhar')">Clique e acompanhe seu atendimento</button><p class="footerlink">Já retornamos com seu atendimento.</p></div>`}
}
function pubDelivery(){const n=(document.getElementById("pubName").value||"Cliente").trim();state.publicClient={name:n};state.publicStep="delivery";go("entrada")}
function savePublicClient(){const n=(document.getElementById("newName").value+" "+document.getElementById("newLast").value).trim();if(!n)return alert("Informe nome e sobrenome.");state.clients.push({name:n,phone:document.getElementById("newPhone").value});state.publicClient={name:n};state.publicStep="delivery";go("entrada")}
function joinQueue(delivery){const t="#"+String(25+state.queue.length+1).padStart(3,"0");let address="";if(delivery)address=`${document.getElementById("street").value}, ${document.getElementById("number").value} - ${document.getElementById("district").value} ${document.getElementById("comp").value}`;const q={ticket:t,name:state.publicClient.name,service:"A definir",status:"waiting",delivery,address};state.queue.push(q);state.publicClient=q;state.publicStep="joined";go("entrada")}
function acompanhar(){const q=state.publicClient||state.queue[1],idx=state.queue.filter(x=>x.status==="waiting").findIndex(x=>x.ticket===q.ticket);return head("Acompanhar Atendimento","Link individual do cliente.")+`<div class="public"><div class="publicbox" style="text-align:center"><div class="label">SUA SENHA</div><div class="timer">${q.ticket}</div><h2>${q.name}</h2><div class="notice"><b>${idx>=0?idx:"0"} cliente(s) na sua frente.</b><br>Aguarde. Quando chegar sua vez, você poderá ser atendido presencialmente ou online.</div><br><button class="btn primary" onclick="go('acompanhar')">↻ Atualizar posição</button></div></div>`}
function tv(){const q=state.queue.find(x=>x.status==="service");return `<div class="tv"><div style="display:flex;justify-content:space-between"><div style="display:flex;align-items:center;gap:14px">
<div style="background:#fff;border-radius:10px;padding:7px 12px">
<img src="LOGO.svg" alt="Adriano Design" style="width:145px;max-height:65px;object-fit:contain;display:block">
</div>
<div><b>ADRIANO DESIGN</b><div style="opacity:.7">Atendimento Personalizado</div></div>
</div><div class="clock globalClock">00:00:00</div></div><div class="tvgrid"><div class="tvcard"><div style="opacity:.7">EM ATENDIMENTO</div><div class="ticket">${q.ticket}</div><h2>${q.name}</h2><p>${q.service}</p><div style="opacity:.7">TEMPO DE ATENDIMENTO</div><div class="tvtime liveTimer">${ft(elapsed(q))}</div><br><span class="badge ok">EM ATENDIMENTO</span></div><div class="tvcard"><h3>PRÓXIMOS CLIENTES</h3>${state.queue.filter(x=>x.status==="waiting").map((x,i)=>`<p style="font-size:22px"><b>${x.ticket}</b> &nbsp; ${x.name}</p>`).join("")}</div></div><p style="text-align:center;opacity:.7;margin-top:25px">Agradecemos a sua espera.</p></div>`}
function generic(title,sub,body){return head(title,sub)+`<div class="panel">${body}</div>`}
function clientes(){return generic("Clientes","Cadastro e histórico",`<button class="btn primary">+ Novo cliente</button><br><br><table class="table"><tr><th>Nome</th><th>WhatsApp</th><th>Pedidos</th></tr>${state.clients.map(c=>`<tr><td>${c.name}</td><td>${c.phone}</td><td>Ver histórico</td></tr>`).join("")}</table>`)}
function ordens(){return generic("Ordens de Serviço","Pedidos e serviços",`<table class="table"><tr><th>OS</th><th>Cliente</th><th>Serviço</th><th>Status</th></tr><tr><td>#1025</td><td>João Silva</td><td>Arte Final</td><td><span class="badge ok">Em produção</span></td></tr><tr><td>#1024</td><td>Carlos Santos</td><td>Impressão</td><td>Finalizada</td></tr></table>`)}
function artes(){return generic("Artes","Versões, arquivos e aprovações",`<div class="cards"><div class="card"><b>OS #1025</b><p>V3 — FINAL</p><span class="badge ok">Aprovada</span></div><div class="card"><b>OS #1024</b><p>V2</p><span class="badge wait">Aguardando</span></div></div>`)}
function impressao(){return generic("Impressão","Controle de metros e produção",`<table class="table"><tr><th>OS</th><th>Metros</th><th>Preço/m</th><th>Status</th></tr><tr><td>#1025</td><td>4,5 m</td><td>R$ 40,00</td><td>Produção</td></tr></table>`)}
function producao(){return head("Produção","Fluxo dos pedidos")+`<div class="kanban"><div class="column"><b>Aguardando</b><div class="job">#1028 — Arte</div></div><div class="column"><b>Produção</b><div class="job">#1025 — Impressão</div></div><div class="column"><b>Conferência</b><div class="job">#1024 — Fotolito</div></div><div class="column"><b>Finalizado</b><div class="job">#1023 — Arte Final</div></div></div>`}
function financeiro(){return generic("Financeiro","Entradas, saídas e contas",`<div class="cards"><div class="card"><div class="label">Entradas</div><div class="metric">R$ 4.850</div></div><div class="card"><div class="label">Saídas</div><div class="metric">R$ 1.730</div></div><div class="card"><div class="label">Saldo</div><div class="metric">R$ 3.120</div></div></div>`)}
function estoque(){return generic("Estoque","Materiais e alertas",`<table class="table"><tr><th>Produto</th><th>Estoque</th><th>Mínimo</th></tr><tr><td>Papel 30m</td><td>8 rolos</td><td>3</td></tr><tr><td>Emulsão</td><td>4 un.</td><td>2</td></tr></table>`)}
function fornecedores(){return generic("Fornecedores","Contatos e compras",`<table class="table"><tr><th>Fornecedor</th><th>Categoria</th><th>Contato</th></tr><tr><td>Fornecedor A</td><td>Papel</td><td>(85) 99999-0000</td></tr></table>`)}
function relatorios(){return generic("Relatórios","Visão gerencial",`<div class="cards"><div class="card">Vendas</div><div class="card">Financeiro</div><div class="card">Produção</div><div class="card">Clientes</div></div><br><button class="btn primary">Exportar PDF</button> <button class="btn">Excel</button> <button class="btn">CSV</button>`)}
function usuarios(){return generic("Usuários","Perfis e permissões",`<table class="table"><tr><th>Usuário</th><th>Perfil</th></tr><tr><td>Adriano Silva</td><td>Administrador</td></tr><tr><td>Atendente</td><td>Atendimento</td></tr></table>`)}
function config(){return generic("Configurações","Empresa e regras do sistema",`<div class="form"><div class="fg"><label>Empresa</label><input class="field" value="Adriano Design"></div><div class="fg"><label>Preço hora atendimento</label><input class="field" value="R$ 30,00"></div><div class="fg full"><label>Link explicativo enviado no WhatsApp</label><input class="field" value="Cole aqui o seu link existente"></div><div class="fg"><label>Cor creme</label><input class="field" value="#FFF9EB"></div><div class="fg"><label>Azul</label><input class="field" value="#6386AC"></div><div class="fg"><label>Azul escuro</label><input class="field" value="#112E4A"></div><div class="fg"><label>Preto</label><input class="field" value="#000000"></div></div>`)}
const pages={dashboard,entrada,atendimento,tv,acompanhar,clientes,ordens,artes,impressao,producao,financeiro,estoque,fornecedores,relatorios,usuarios,config,venda};
function go(p){document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p===p));C.innerHTML=pages[p]();window.scrollTo(0,0)}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go(b.dataset.p));
setInterval(()=>{document.querySelectorAll(".globalClock").forEach(e=>e.textContent=new Date().toLocaleTimeString("pt-BR"));const q=state.queue.find(x=>x.status==="service");document.querySelectorAll(".liveTimer").forEach(e=>e.textContent=ft(elapsed(q)))},500);
go("dashboard");
</script>
